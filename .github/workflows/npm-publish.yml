# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches: assignment-4
  pull_request:
    branches: assignment-4
    

jobs:
  HTML_Linting:
    name: html linter
    runs-on: ubuntu-latest
    steps:  
      - run: node_modules/.bin/linthtml "/public/color.html"
      - run: node_modules/.bin/linthtml "/public/index.html"

  CSS_Linting:
    name: css linter
    runs-on: ubuntu-latest
    steps:
        - run: node_modules/.bin/csslint "public/css/styles.css"
  JS_Linting:
    name: js linter
    runs-on: ubuntu-latest
    steps:
      - run: node_modules/.bin/quick-lint-js public/js/code.js

  


  
