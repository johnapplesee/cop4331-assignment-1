
name: HTML, CSS, and Javascript Linter

on:
  push:
    branches: assignment-4
  pull_request:
    branches: assignment-4

jobs:
  HTML_Linting:
    name: html linter
    runs-on: ubuntu-latest
    steps:  
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: chmod +x node_modules/.bin/linthtml "public/color.html"
      - run: chmod +x node_modules/.bin/linthtml "public/index.html"

  CSS_Linting:
    name: css linter
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
        - run: chmod +x node_modules/.bin/csslint "public/css/styles.css"
        
  JS_Linting:
    name: js linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: chmod +x node_modules/.bin/quick-lint-js public/js/code.js

  


  
